services:
  postgres:
    image: postgres:16-alpine
    container_name: subwallet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subwallet
      POSTGRES_PASSWORD: subwallet_dev_password
      POSTGRES_DB: subwallet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subwallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: subwallet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kuyruk işlerini görsel takip için (opsiyonel, geliştirme ortamı)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: subwallet_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8085:8081"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
