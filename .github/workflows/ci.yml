name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subwallet
          POSTGRES_PASSWORD: subwallet_dev_password
          POSTGRES_DB: subwallet
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrate Deploy & Generate
        env:
          DATABASE_URL: postgresql://subwallet:subwallet_dev_password@localhost:5433/subwallet?schema=public
        run: |
          npx prisma generate --schema=apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Type-check / Build
        run: npm --workspace apps/api run build

      - name: Run Unit Tests with Coverage Threshold
        env:
          DATABASE_URL: postgresql://subwallet:subwallet_dev_password@localhost:5433/subwallet?schema=public
          JWT_ACCESS_SECRET: super-secret-jwt-access-key-minimum-32-chars
          REDIS_HOST: localhost
        run: npm --workspace apps/api run test -- --coverage --coverageThreshold='{"global":{"lines":70}}'

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://subwallet:subwallet_dev_password@localhost:5433/subwallet?schema=public
          JWT_ACCESS_SECRET: super-secret-jwt-access-key-minimum-32-chars
          REDIS_HOST: localhost
        run: npm --workspace apps/api run test:e2e
